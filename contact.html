  </head>

  <body class="contact-page">
    <!-- Main navigation header -->
    <header class="main-header">
      <nav class="nav-container">
        <!-- Logo section -->
        <div class="logo">
          <a href="index.html">
            <img src="assets/bonyxlogo.png" alt="BrilliantONYX" />
          </a>
        </div>

        <!-- Mobile menu button -->
        <button class="mobile-menu-btn" aria-label="Toggle mobile menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- Navigation links -->
        <ul class="nav-links">
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="projects.html" class="nav-link">Projects</a></li>
          <li><a href="index.html#services" class="nav-link">Services</a></li>
          <li><a href="index.html#sectors" class="nav-link">Sectors</a></li>
          <li><a href="index.html#clients" class="nav-link">Clients</a></li>
          <li><a href="contact.html" class="nav-link active">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- Main contact section -->
    <main class="contact-section">
      <div class="contact-container">
        <!-- Google Maps embed -->
        <div class="contact-map">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3611.0647885786396!2d55.37117731501961!3d25.1276899839326!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e5f6419b66d5c69%3A0x9f0d6e4a9b2f9c7a!2sDonna%20Tower%2C%20Dubai%20Silicon%20Oasis%20-%20Dubai%20-%20United%20Arab%20Emirates!5e0!3m2!1sen!2sae!4v1648123456789!5m2!1sen!2sae"
            width="600"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>

        <!-- Contact form section -->
        <div class="contact-form-container">
          <h1>Contact Us</h1>

          <form class="contact-form">
            <!-- Name fields row -->
            <div class="form-row">
              <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="John" />
              </div>
              <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Doe" />
              </div>
            </div>

            <!-- Contact information row -->
            <div class="form-row">
              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="058 123 1234" />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="doejohn@email.com" />
              </div>
            </div>

            <!-- Services checkboxes -->
            <div class="form-group">
              <label>Service/s Interested In</label>
              <div class="services-checkboxes">
                <label class="checkbox-container">
                  <input type="checkbox" name="services[]" value="fitout" />
                  <span class="checkmark"></span>
                  Fit Out Works
                </label>
                <label class="checkbox-container">
                  <input type="checkbox" name="services[]" value="interior" />
                  <span class="checkmark"></span>
                  Interior Design
                </label>
                <label class="checkbox-container">
                  <input type="checkbox" name="services[]" value="maintenance" />
                  <span class="checkmark"></span>
                  Building Maintenance
                </label>
                <label class="checkbox-container">
                  <input type="checkbox" name="services[]" value="carpentry" />
                  <span class="checkmark"></span>
                  Carpentry Works
                </label>
              </div>
            </div>

            <!-- Message textarea -->
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" placeholder="Write your message..."></textarea>
            </div>

            <!-- Submit button -->
            <button type="submit" class="submit-btn">
              Send Message
              <span class="arrow">→</span>
            </button>
          </form>
        </div>
      </div>
    </main>

        <!-- Footer section -->
        <footer class="main-footer">
          <div class="footer-container">
            <!-- Footer logo -->
            <div class="footer-logo-container">
              <img src="assets/BO icon.png" alt="BrilliantONYX Logo" class="footer-logo" />
            </div>
            <!-- Footer content sections -->
            <div class="footer-content">
              <div class="footer-section">
                <h3>Email us</h3>
                <p><a href="mailto:info@bonyx.net">info@bonyx.net</a></p>
              </div>
              <div class="footer-section">
                <h3>Phone us</h3>
                <p><a href="tel:+97143624845">+971 4 362 4845</a></p>
              </div>
              <div class="footer-section">
                <h3>Location</h3>
                <p>1704, Donna Tower, Nadd Hessa</p>
                <p>Dubai Silicon Oasis</p>
                <p>Dubai, United Arab Emirates</p>
              </div>
            </div>
          </div>
          <!-- Footer bottom section -->
          <div class="footer-bottom">
            <div class="footer-bottom-links">
              <a href="privacy.html">Privacy Policy</a>
              <a href="privacy.html#terms">Terms of Service</a>
              <span style="margin-left: 20px; color: rgba(255, 255, 255, 0.7);">Made with ❤️ by <a href="https://najah.io/" target="_blank" style="color: rgba(255, 255, 255, 0.9); text-decoration: none;">Najah Media</a></span>
            </div>
            <!-- Social media links -->
            <div class="social-links">
              <a href="https://www.facebook.com/BrilliantOnxy/" target="_blank" aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
              </a>
              <a href="https://ae.linkedin.com/company/brilliant-onyx" target="_blank" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
              </a>
              <a href="https://www.instagram.com/bonyxinteriors/" target="_blank" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
              </a>
            </div>
          </div>
        </footer>

    <!-- Back to top button -->
    <button id="back-to-top" aria-label="Back to top">
      <i class="fas fa-arrow-up"></i>
    </button>

    <script src="script.js?v=4.0.0"></script>
